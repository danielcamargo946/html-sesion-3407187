<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Profiele</title>
    <style>
        .card {
            margin: 0;
            padding: 0;
        }

        body{ 
            background-color: #e5e6e8;
        }
        .card {
            display: block;
            width: 300px;
            height: 400PX;
            background-color: #fff;
            margin: 20px auto;
        }

        .card__company {
            display: block;
            width: 100%;
            height: 100px;
            background-color: #404042;
        }

        .card__flag {
            display: block;
            width: auto;
            height: 50px;
            background-color: #7acbc7;
        }
        .card__imagen{
            display: block;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: #fff solid 5px;
            margin-top: -70px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card__company"></div>
        <div class="card__flag"></div>
        <img src="../evidencias/perfil.jpg" alt="" class="card__imagen">
    </div>
</body>
</html>
