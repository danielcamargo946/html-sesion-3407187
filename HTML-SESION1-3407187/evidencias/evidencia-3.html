<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>targeta</title>
    <style>
        .admi{
            position: relative;
            display: block;
            background-color: orange;
            width: 330px;
            height: 400PX;
   
            border-radius: 20px;
        }
        .img{
            width: 290px;
            height: 350px;

            margin: 19px;
            margin-top: 16px;
            border-radius: 20px;
        }
        .spa{
            position: absolute;
            display: block;
            background-color: rgb(52, 52, 52);
            width: 100%;
            height: 60%;
            margin-top: -67.1%;
            border-radius: 20px;
        }
        .calamardo{
            color: rgb(255, 201, 100);
            text-align: center;
            font-family:Arial, Helvetica, sans-serif;
        }
        .lorem{
            color: aliceblue;
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            margin: 15px;
        }
        .boton{
        
            margin: auto;
            margin-top: 10%;
            width: 100px;
            height: 30px;
            background-color: rgb(218, 142, 0);
            text-align: center;
            letter-spacing: 2px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="admi">
        <img src="images.jpeg" alt="" class="img">      
        <div class="spa">
            <p class="calamardo">
                Calamardo guapo
            </p>
            <p class="lorem">Lorem ipsum dolor sit amet consectetur adipisicing elit. Sed facilis sunt 
                laudantium quas optio 
                modi in quisquam iste ducimus voluptas magnam culpa facere,
                 dolorem sit odio animi? Placeat, esse omnis.</p>
            <div class="boton">
                botton
            </div>
        </div>
    </div>
    
</body>
</html>
