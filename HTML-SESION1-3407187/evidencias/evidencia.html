<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .padre{
            display:block;
            background-color: rgb(223, 218, 177);
            width: 400px;
            height: auto;
            padding: 30px 20px 5px 40px;
            border: black 10px groove;
            margin-top: 30px;
            margin-left: 20px;
            border-radius: 20px;
        }
        .hijo{
            display: block;
            background-color: rgb(0, 0, 0);
            width: 200px;
            height: 200px;
            padding-top: 20px;
            padding-left: 10px;
            border-top: rgb(255, 0, 0) 5px solid;
            border-right-style:dotted ;
            border-right-width:20px ;
            border-right: 50px;
            margin: 20px auto;
            margin-bottom: 30px;
            border-radius: 20px;
            border-bottom-left-radius: 30px;
            border-top-right-radius: 40px;


        }
        .hijo2{
            display: block;
            background-color: rgb(255, 112, 255);
            width: 200px;
            height: 200px;
            padding-top: 20px;
            padding-left: 10px;
            border-top: black 5px solid;
            border-right-style:dotted ;
            border-right-width:20px ;
            border-right: 50px;
            margin: 20px auto ;
            margin-bottom: 30px;

            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="padre">
        <div class="hijo">hijo</div>
        <div class="hijo2"></div>
        <div class="hijo"></div>
    </div>
</body>
</html>
